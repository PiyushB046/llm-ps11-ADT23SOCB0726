# Render deployment (Blueprint). Render reads this file and sets up the web service.
services:
  - type: web
    name: college-enquiry-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false   # Render asks you to paste the key; it is never stored in the code
